<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Sampling</title>
  <desc id="desc">Sampling grenzt die möglichen nächsten Tokens ein und wählt daraus per gewichteter Zufallsauswahl ein Token aus.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" /></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" /></marker>
    <style>
      .bg{fill:#0b1120}.title{fill:#f8fafc;font:700 24px ui-sans-serif,system-ui,sans-serif}.subtitle{fill:#cbd5e1;font:400 15px ui-sans-serif,system-ui,sans-serif}.panel{fill:#111827;stroke:#334155;stroke-width:1.5;rx:12}.node{fill:#1f2937;stroke:#38bdf8;stroke-width:2;rx:10}.choice{fill:#064e3b;stroke:#34d399;stroke-width:2;rx:10}.muted{fill:#111827;stroke:#64748b;stroke-width:2;stroke-dasharray:6 6;rx:10}.label{fill:#f8fafc;font:700 15px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}.small{fill:#cbd5e1;font:400 13px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}.muted-label{fill:#94a3b8;font:700 15px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}.muted-small{fill:#64748b;font:400 13px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}.edge{stroke:#38bdf8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.edge-muted{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow-muted)}.step{fill:#94a3b8;font:700 12px ui-sans-serif,system-ui,sans-serif;text-anchor:middle;letter-spacing:.08em}.bar{fill:#38bdf8}.bar-muted{fill:#475569}.bar-choice{fill:#34d399}
    </style>
  </defs>
  <rect class="bg" width="980" height="520" />
  <text class="title" x="40" y="46">Sampling</text>
  <text class="subtitle" x="40" y="72">Das Modell berechnet Wahrscheinlichkeiten, die Sampling-Methode schneidet die Auswahl zu, danach entscheidet gewichteter Zufall.</text>

  <text class="step" x="132" y="124">1. WAHRSCHEINLICHKEITEN</text>
  <text class="step" x="410" y="124">2. AUSWAHL EINGRENZEN</text>
  <text class="step" x="686" y="124">3. GEWICHTET ZIEHEN</text>
  <text class="step" x="850" y="124">4. ANHÄNGEN</text>

  <rect class="panel" x="40" y="148" width="184" height="238" />
  <text class="label" x="132" y="178">mögliche Tokens</text>
  <text class="small" x="132" y="204">nach dem Forward Pass</text>
  <text class="small" x="84" y="238">Tür</text><rect class="bar" x="118" y="224" width="72" height="18" rx="4" /><text class="small" x="198" y="238">60%</text>
  <text class="small" x="84" y="274">Haus</text><rect class="bar" x="118" y="260" width="42" height="18" rx="4" /><text class="small" x="198" y="274">35%</text>
  <text class="small" x="84" y="310">Hund</text><rect class="bar" x="118" y="296" width="18" height="18" rx="4" /><text class="small" x="198" y="310">12%</text>
  <text class="small" x="84" y="346">weil</text><rect class="bar-muted" x="118" y="332" width="9" height="18" rx="4" /><text class="small" x="198" y="346">3%</text>

  <rect class="node" x="310" y="178" width="200" height="76" />
  <text class="label" x="410" y="207">Sampling-Parameter</text>
  <text class="small" x="410" y="232">Top-K, Top-P, Temperature</text>
  <rect class="node" x="310" y="292" width="200" height="76" />
  <text class="label" x="410" y="321">zugelassene Auswahl</text>
  <text class="small" x="410" y="346">Tür, Haus, Hund</text>

  <rect class="choice" x="604" y="178" width="164" height="76" />
  <text class="label" x="686" y="207">gewichteter Zufall</text>
  <text class="small" x="686" y="232">hohe Werte gewinnen öfter</text>
  <rect class="muted" x="604" y="292" width="164" height="76" />
  <text class="muted-label" x="686" y="321">nicht deterministisch</text>
  <text class="muted-small" x="686" y="346">gleicher Prompt, andere Ziehung</text>

  <rect class="choice" x="808" y="214" width="118" height="76" />
  <text class="label" x="867" y="243">gewählt:</text>
  <text class="small" x="867" y="268">Haus</text>

  <rect class="panel" x="794" y="330" width="146" height="56" />
  <text class="small" x="867" y="354">Sequenz + Token</text>
  <text class="label" x="867" y="376">... Haus</text>

  <path class="edge" d="M224 250 C258 224 276 216 310 216" />
  <path class="edge" d="M410 254 C410 270 410 276 410 292" />
  <path class="edge" d="M510 330 C552 294 574 252 604 216" />
  <path class="edge-muted" d="M510 346 C552 358 574 354 604 342" />
  <path class="edge" d="M768 216 C786 228 794 240 808 252" />
  <path class="edge" d="M867 290 C867 310 867 316 867 330" />

  <rect x="238" y="432" width="504" height="44" fill="#172033" stroke="#38bdf8" stroke-width="1.5" rx="10" />
  <text class="subtitle" x="490" y="459" text-anchor="middle">Nicht immer gewinnt das wahrscheinlichste Token, aber es hat die größte Chance.</text>
</svg>