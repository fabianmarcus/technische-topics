<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-labelledby="title desc">
  <title id="title">Zusammenhang zwischen EAA, BFSG, EN 301 549 und WCAG</title>
  <desc id="desc">Vertikales Diagramm: Der European Accessibility Act führt zum BFSG, das BFSG führt zur DIN EN 301 549 und die DIN EN 301 549 führt zu den WCAG.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
    <style>
      .bg{fill:#0b1120}.title{fill:#f8fafc;font:700 25px ui-sans-serif,system-ui,sans-serif}.subtitle{fill:#cbd5e1;font:400 15px ui-sans-serif,system-ui,sans-serif}.node{fill:#1f2937;stroke:#38bdf8;stroke-width:2.5;rx:14;filter:url(#shadow)}.label{fill:#f8fafc;font:700 20px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}.meta{fill:#cbd5e1;font:400 15px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}.edge{stroke:#38bdf8;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="720" height="680" />
  <text class="title" x="40" y="46">EAA, BFSG, DIN EN 301 549 und WCAG</text>
  <text class="subtitle" x="40" y="74">Die Kette vom europäischen Rechtsrahmen zu konkreten Web-Accessibility-Regeln.</text>
  <rect class="node eaa" x="170" y="116" width="380" height="92" />
  <text class="label" x="360" y="154">European Accessibility Act (EAA)</text>
  <text class="meta" x="360" y="181">EU-Richtlinie</text>
  <path class="edge" d="M360 208 V257" />
  <rect class="node bfsg" x="170" y="268" width="380" height="92" />
  <text class="label" x="360" y="306">Barrierefreiheitsstärkungsgesetz (BFSG)</text>
  <text class="meta" x="360" y="333">Deutsches Gesetz</text>
  <path class="edge" d="M360 360 V409" />
  <rect class="node en" x="170" y="420" width="380" height="92" />
  <text class="label" x="360" y="458">DIN EN 301 549</text>
  <text class="meta" x="360" y="485">Technische Norm</text>
  <path class="edge" d="M360 512 V561" />
  <rect class="node wcag" x="170" y="572" width="380" height="72" />
  <text class="label" x="360" y="601">WCAG</text>
  <text class="meta" x="360" y="626">Web-Accessibility-Regeln</text>
</svg>
