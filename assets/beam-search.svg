<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Beam Search</title>
  <desc id="desc">Beam Search verfolgt mehrere Token-Pfade parallel und behält pro Schritt nur die besten Sequenzen.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" /></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" /></marker>
    <style>
      .bg{fill:#0b1120}.title{fill:#f8fafc;font:700 24px ui-sans-serif,system-ui,sans-serif}.subtitle{fill:#cbd5e1;font:400 15px ui-sans-serif,system-ui,sans-serif}.node{fill:#1f2937;stroke:#38bdf8;stroke-width:2;rx:10}.muted{fill:#111827;stroke:#64748b;stroke-width:2;stroke-dasharray:6 6;rx:10}.result{fill:#064e3b;stroke:#34d399;stroke-width:2;rx:10}.alternative{fill:#312e81;stroke:#818cf8;stroke-width:2;rx:10}.label{fill:#f8fafc;font:700 15px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}.score{fill:#cbd5e1;font:400 13px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}.muted-label{fill:#94a3b8;font:700 15px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}.muted-score{fill:#64748b;font:400 13px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}.edge{stroke:#38bdf8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.edge-muted{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow-muted)}.step{fill:#94a3b8;font:700 12px ui-sans-serif,system-ui,sans-serif;text-anchor:middle;letter-spacing:.08em}
    </style>
  </defs>
  <rect class="bg" width="960" height="500" />
  <text class="title" x="40" y="46">Beam Search</text>
  <text class="subtitle" x="40" y="72">Mehrere Pfade laufen parallel. Bei Strahlbreite 2 bleiben pro Schritt die zwei besten Sequenzen aktiv.</text>
  <text class="step" x="96" y="120">START</text><text class="step" x="286" y="120">SCHRITT 1</text><text class="step" x="506" y="120">SCHRITT 2</text><text class="step" x="738" y="120">SCHRITT 3</text>
  <rect class="node" x="38" y="218" width="116" height="64" /><text class="label" x="96" y="244">&lt;s&gt;</text><text class="score" x="96" y="266">Start</text>
  <rect class="node" x="228" y="150" width="116" height="64" /><text class="label" x="286" y="176">der</text><text class="score" x="286" y="198">Bewertung: -0,4</text>
  <rect class="node" x="228" y="238" width="116" height="64" /><text class="label" x="286" y="264">ein</text><text class="score" x="286" y="286">Bewertung: -0,7</text>
  <rect class="muted" x="228" y="326" width="116" height="64" /><text class="muted-label" x="286" y="352">dieser</text><text class="muted-score" x="286" y="374">verworfen</text>
  <rect class="node" x="448" y="126" width="116" height="64" /><text class="label" x="506" y="152">der Hund</text><text class="score" x="506" y="174">Bewertung: -0,9</text>
  <rect class="node" x="448" y="238" width="116" height="64" /><text class="label" x="506" y="264">ein Hund</text><text class="score" x="506" y="286">Bewertung: -1,0</text>
  <rect class="muted" x="448" y="350" width="116" height="64" /><text class="muted-label" x="506" y="376">der Baum</text><text class="muted-score" x="506" y="398">verworfen</text>
  <rect class="result" x="660" y="126" width="156" height="64" /><text class="label" x="738" y="152">der Hund läuft</text><text class="score" x="738" y="174">Ausgabe</text>
  <rect class="alternative" x="660" y="238" width="156" height="64" /><text class="label" x="738" y="264">ein Hund läuft</text><text class="score" x="738" y="286">Alternative</text>
  <rect class="muted" x="660" y="350" width="156" height="64" /><text class="muted-label" x="738" y="376">ein Hund bellt</text><text class="muted-score" x="738" y="398">verworfen</text>
  <path class="edge" d="M154 236 C182 207 200 190 228 182" /><path class="edge" d="M154 252 C184 260 200 268 228 270" /><path class="edge-muted" d="M154 268 C184 325 200 354 228 358" /><path class="edge" d="M344 174 C384 160 408 158 448 158" /><path class="edge-muted" d="M344 196 C388 315 405 378 448 382" /><path class="edge" d="M344 270 C384 270 408 270 448 270" /><path class="edge" d="M564 158 C602 158 622 158 660 158" /><path class="edge" d="M564 270 C602 270 622 270 660 270" /><path class="edge-muted" d="M564 286 C604 337 622 379 660 382" />
  <rect x="226" y="434" width="590" height="44" fill="#172033" stroke="#38bdf8" stroke-width="1.5" rx="10" /><text class="subtitle" x="521" y="461" text-anchor="middle">Die finale Antwort kann aus einem anderen Pfad kommen als der anfangs beste Einzelkandidat.</text>
</svg>